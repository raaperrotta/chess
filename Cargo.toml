[package]
name = "chess"
version = "3.3.0-rbc"
edition = "2018"
authors = [
    "Jordan Bray <jordanbray@gmail.com>",
    "Robert Perrotta",
]
description = "Reconnaissance Blind Chess (RBC) move generator and player framework, forked from jordanbray/chess. Implements the reconchess rules (castling-through-check allowed, no notion of check, sense-then-move turns) on top of the upstream fast bitboard move generator."
build = "src/build.rs"

# Upstream homepage retained for context; this fork is at the URL below.
homepage = "https://github.com/anomalyco/opencode"
repository = "https://github.com/anomalyco/opencode"
readme = "README.md"
keywords = ["chess", "rbc", "reconchess", "reconnaissance", "move-generator"]
license = "MIT"

[dependencies]
arrayvec = "0.7.2"
# nodrop is deprecated upstream in favor of MaybeUninit; keeping for now
# as it is used by the move-list ArrayVec wrapper.
nodrop = "0.1.14"
# failure is deprecated upstream in favor of thiserror; keeping for now
# to minimize churn during the RBC migration.
failure = "0.1.6"
num-format = "0.4.4"
rand = "0.9.0-alpha.0"
rayon = "1.9.0"
indicatif = {version = "0.17.8", features = ["rayon"]}
rustc-hash = "2"

[profile.release]
opt-level = 3
debug = false

# Note: dev/test are kept at opt-level=3 because the lookup-table generation
# in build.rs and the move-generation hot paths are slow enough at lower
# levels that running tests becomes painful. If you want faster incremental
# compiles at the cost of slower test runs, drop these to 1.
[profile.dev]
opt-level = 3
debug = true

[profile.test]
opt-level = 3

# Always optimize the build script, because it takes a long time to run
# unoptimized.
[profile.dev.build-override]
opt-level = 3
[profile.release.build-override]
opt-level = 3
[profile.test.build-override]
opt-level = 3

[build-dependencies]
rand = { version = "0.7.2", default-features = false, features = ["small_rng"] }
failure = "0.1.6"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# All other binaries in src/bin/ are auto-discovered by cargo.
